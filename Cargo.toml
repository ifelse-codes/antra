[package]
name = "antra"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Native local development proxy — stable domains for localhost servers"
license = "MIT"
repository = "https://github.com/ifelse-codes/antra"

[[bin]]
name = "antra"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"

# Certificate generation
rcgen = { version = "0.14", features = ["x509-parser"] }

# Strict X.509 validation of what we mint (see `certs::validate`).
# Pinned to the same major/minor rcgen pulls in, so there is exactly one
# copy of the parser in the tree.
x509-parser = "0.16"

# Certificate validity windows ("now ± 2 years 3 months"). Already in the
# tree via rcgen; direct because we construct the dates ourselves.
time = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Middleware
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Error handling
anyhow = "1"

# Platform
dirs = "5"
colored = "2"
open = "5"

# Trust store
os-truststore = "0.0.2"

# WebSocket key generation
rand = "0.9"
base64 = "0.22"

# Temp files for CA install
tempfile = "3"

# Unix APIs (signals, process groups)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"

# Windows APIs (named pipes)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
schannel = "0.1.29"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
base64 = "0.22"
# Only to re-mint the pre-0.5 CA shape in the SecureTransport sensitivity
# test, so the regression gate can be shown to still fail on the old bug.
rcgen = "0.14"
