<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Antra</title>
<meta name="description" content="That page does not exist.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0a0c;
    --fg: #e8e6f0;
    --dim: #6b6875;
    --accent: #8b7cf6;
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf9fc; --fg: #16151a; --dim: #77748020; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 2rem; max-width: 34rem; text-align: center; }
  h1 {
    font-family: var(--mono);
    font-size: clamp(3rem, 12vw, 5.5rem);
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.04em;
    color: var(--accent);
  }
  p { color: var(--dim); line-height: 1.6; margin: 1rem 0 2rem; }
  code {
    font-family: var(--mono);
    font-size: 0.9em;
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  a:hover { border-bottom-color: var(--accent); }
  .hint { font-size: 0.85rem; margin-top: 3rem; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>This page does not exist. The domain you are probably after is
    <code>https://myapp.localhost</code> — and that one resolves to
    <em>your</em> machine, not ours.</p>
  <p><a href="/">Back to antra.iifelse.com</a></p>
  <p class="hint">Looking for the tool? <a href="https://github.com/ifelse-codes/antra">github.com/ifelse-codes/antra</a></p>
</main>
</body>
</html>
