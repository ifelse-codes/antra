name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose -- --test-threads=4

  windows-test:
    name: Windows Test (Hermetic)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile all test targets
        run: cargo test --no-run
        timeout-minutes: 20
      - name: Run hermetic tests
        run: cargo test --lib --bin antra --test cert_store --test cert_strict --test cli_utils --test config_project --test ipc_handlers --test ipc_protocol --test proxy_headers --test proxy_websocket --test routing_registry --test upstream_dual_stack --test util_port -- --test-threads=1 --skip test_cert_cache_resolve
        timeout-minutes: 10

  e2e-shell:
    name: E2E Shell Suites (${{ matrix.os }})
    # Scope note: the two language/framework-detection suites
    # (e2e_all_features.sh, e2e_next_sprint.sh) are intentionally NOT run here
    # yet. They assert on `antra dev`'s spawn line ("Started: <cmd>"), so they
    # only pass where pnpm/go/rails/sinatra/rackup are installed, and they were
    # only ever validated on a full dev toolchain. On a lean CI runner they fail
    # for reasons unrelated to this wiring, and e2e_next_sprint.sh additionally
    # has a platform bug (service status greps for "not installed", but Linux
    # prints "installed but not running"). They will be added once made
    # hermetic (need-gates on the toolchain they execute + a platform-aware
    # service assertion). Until then this job covers the two suites that
    # genuinely exercise the real binary end to end, including the HTTPS proxy
    # path.
    runs-on: ${{ matrix.os }}
    # parity + simple spawn the real binary and the real proxy, so they are
    # slower than a unit test but finish in a few minutes. 30 min leaves room
    # for a cold `cargo build` on a 2-core runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # A short, hermetic HOME. Not optional: the daemon's Unix socket path
      # must fit the 104-byte `sun_path` limit, and on macOS the derived path
      # is `$HOME/Library/Application Support/antra/daemon.sock` — a home
      # deeper than ~54 chars leaves the daemon unstartable. It also gives the
      # suites a clean config/trust store instead of the runner's real ~/.antra.
      # (The Windows job is excluded: the suites are bash and use /dev/tcp
      # and /tmp.)
      CI_HOME: /tmp/ah-ci
      # High, free-range ports. Not 443 (needs root) and not 8443/8080 (often
      # in use). Asserted free below before anything binds them.
      ANTRA_PORT: "18999"
      ANTRA_HTTP_PORT: "18998"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and run shell E2E suites
        shell: bash
        run: |
          # Runs the portless-parity and zero-config suites against the real
          # binary, including the end-to-end HTTPS proxy test. Neither has any
          # SKIP path, so a green run means every assertion in both passed.
          set -euo pipefail

          # rustup and cargo live under the *real* home. Capture them before
          # HOME is redirected, or cargo cannot find its toolchain ("could not
          # choose a version of cargo to run"). Redirecting HOME alone is a trap.
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"

          export HOME="$CI_HOME"
          mkdir -p "$HOME"

          ART="$RUNNER_TEMP/antra-e2e-artifacts"
          mkdir -p "$ART"

          echo "HOME=$HOME  (socket path budget: ${#HOME} chars + 44 for the macOS daemon.sock prefix)"
          echo "ANTRA_PORT=$ANTRA_PORT  ANTRA_HTTP_PORT=$ANTRA_HTTP_PORT"

          # Fail fast if the chosen ports are already taken on this runner.
          for p in "$ANTRA_PORT" "$ANTRA_HTTP_PORT"; do
            if (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null; then
              echo "::error::port $p is already in use on the runner"
              exit 1
            fi
          done

          cargo build --verbose

          # The suites key their /tmp scratch dirs and results files off the
          # basename of the cwd, so run them from the repo root.
          cd "$GITHUB_WORKSPACE"
          status=0
          # A plain "name=rc name=rc" string, not an associative array: the
          # macOS runner's /bin/bash is 3.2 and has no `declare -A`.
          results=""
          for f in tests/e2e_portless_parity.sh tests/e2e_portless_simple.sh; do
            name="$(basename "$f" .sh)"
            echo "::group::$name"
            set +e
            bash "$f" 2>&1 | tee "$ART/$name.log"
            rc="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            results="$results $name=$rc"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$name::suite exited $rc"
              status=1
            fi
          done

          # Copy each suite's own results file into the artifact. It is
          # namespaced per worktree, so glob rather than hardcode;
          # e2e_portless_simple.sh writes none, hence the per-suite stdout
          # logs above.
          cp /tmp/antra-*results-*.txt "$ART"/ 2>/dev/null || true

          # Disclose what was and was not checked, so a green run never implies
          # more than it did.
          {
            echo "## E2E shell suites — ${GITHUB_JOB}"
            echo
            echo "| suite | exit |"
            echo "| --- | --- |"
            for entry in $results; do
              echo "| ${entry%%=*} | ${entry##*=} |"
            done
            echo
            echo "Covers the portless-parity and zero-config suites, including the real end-to-end HTTPS proxy test. The language/framework-detection suites (e2e_all_features.sh, e2e_next_sprint.sh) are not run here yet: they assert on the detected toolchain actually spawning, so they only pass on a full dev toolchain, and e2e_next_sprint.sh has a platform-specific service-status assertion. They will be added once made hermetic."
          } >> "$GITHUB_STEP_SUMMARY"

          # Run every suite, then fail: a single failure should not hide the
          # rest of the results.
          exit $status
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-results-${{ matrix.os }}
          path: ${{ runner.temp }}/antra-e2e-artifacts
          if-no-files-found: warn
